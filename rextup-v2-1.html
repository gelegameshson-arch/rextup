<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>REXTUP</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#272727;--ink:#f1f1f1;--mute:#aaa;--line:#303030;--red:#f03;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.25rem;direction:ltr;margin-inline-end:auto}
.logo i{width:30px;height:21px;background:var(--red);border-radius:6px;position:relative}
.logo i:after{content:"";position:absolute;top:5px;left:12px;border:5.5px solid transparent;border-left:9px solid #fff;border-right:0}
.ib{font-size:1.4rem;width:40px;height:40px;border-radius:50%}
.ib:active{background:var(--bg2)}
.sbox{flex:1;display:flex;align-items:center;background:var(--bg2);border-radius:20px;padding:0 6px 0 14px;height:40px}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));background:var(--bg);z-index:4;scrollbar-width:none}
.chip{background:var(--bg2);border-radius:8px;padding:6px 14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#0f0f0f}
.feed{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px 14px}
.card{cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg2);display:block}
@media(min-width:700px){.card img{border-radius:12px}.feed{padding:0 14px}}
.meta{display:flex;gap:12px;padding:10px 14px 0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.meta h3{margin:0;font-size:1rem;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
.tag{position:absolute;bottom:8px;left:8px;background:#000c;border-radius:6px;padding:2px 8px;font-size:.8rem}
.rel{position:relative}
.msg{color:var(--mute);padding:48px 24px;text-align:center;line-height:1.9}
h2{margin:6px 14px;font-size:1.1rem}
.player{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:3;width:100%;aspect-ratio:16/9;background:#000;max-width:1000px;margin:0 auto}
.player iframe{width:100%;height:100%;border:0;display:block}
.w{max-width:1000px;margin:0 auto}
.w h1{font-size:1.15rem;margin:12px 14px 6px;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;padding:6px 14px;flex-wrap:wrap}
.bar b{flex:1;font-weight:500}
.pill{background:var(--bg2);border-radius:20px;padding:8px 16px}
.pill.w2{background:var(--ink);color:#0f0f0f}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:8px 0 6px;font-size:.72rem;color:var(--mute);display:grid;gap:2px;justify-items:center}
nav button span{font-size:1.35rem;line-height:1}
nav button.on{color:var(--ink);font-weight:500}
.wrap{margin-top:74px}
.board{margin:0 12px 12px;border:12px solid #8b5a2b;border-radius:10px;background:#24362d;padding:40px 12px 16px;position:relative;box-shadow:0 8px 24px #000a;max-width:900px}
@media(min-width:960px){.board{margin-inline:auto}}
.board:before,.board:after{content:"";position:absolute;top:-80px;width:2px;height:70px;background:#c9c9c9}
.board:before{right:22%}.board:after{left:22%}
.papers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.papers{grid-template-columns:repeat(4,1fr)}}
.paper{aspect-ratio:1;border-radius:4px;position:relative;box-shadow:2px 4px 8px #0008}
.paper textarea{width:100%;height:100%;resize:none;border:0;background:none;padding:24px 10px 10px;color:#222;outline:0;line-height:1.5}
.paper .x{position:absolute;top:2px;left:4px;color:#0006;font-size:1rem}
.c0{background:#fff176}.c1{background:#ffcc80}.c2{background:#a5d6a7}.c3{background:#90caf9}
.add{border:3px dashed #fff6;background:none;color:#fff;font-size:2.6rem;box-shadow:none}
.clk{position:absolute;top:6px;left:8px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:1.4rem;color:#000;box-shadow:0 2px 6px #0008;z-index:2}
.sheet{position:fixed;inset:0;z-index:9;background:#000b;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:6px;align-items:center;margin:8px 0}
.row input[type=time],.row input[type=text],.field{background:var(--bg2);border:0;border-radius:8px;padding:9px 10px;min-width:0}
.row input[type=text]{flex:1}
.row label{display:flex;gap:4px;align-items:center;font-size:.85rem;white-space:nowrap}
#ring{position:fixed;top:70px;left:12px;right:12px;z-index:20;background:#f2b705;color:#111;border-radius:12px;padding:14px;font-weight:800;display:none;gap:10px;align-items:center}
</style>
</head>
<body>
<header id="hd"></header>
<div id="ring"><span id="rt" style="flex:1"></span><button id="rx" class="pill" style="background:#111;color:#fff">إغلاق</button></div>
<div id="mainv"></div>
<nav id="nv"></nav>
<div class="sheet" id="sh"><div id="shc"></div></div>
<script>
const SUFFIX=' شرح السادس الاعدادي';
const SUBJ=['الكل','الفيزياء','الكيمياء','الأحياء','الرياضيات','اللغة العربية','اللغة الانكليزية','الإسلامية'];
const NAV=[['home','🏠','الرئيسية'],['arch','🗂️','الأرشيف'],['subs','📺','الاشتراكات'],['notes','📝','ملاحظاتي'],['you','👤','أنت']];
let S={key:'',subs:{},hist:[],saved:[],notes:[{id:1,t:''}],sched:[],cache:{},avs:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('rextup')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rextup',JSON.stringify(S))}catch(e){S.cache={};try{localStorage.setItem('rextup',JSON.stringify(S))}catch(x){}}};
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=s=>{const d=document.createElement('textarea');d.innerHTML=s;return d.value};
let cur={n:'home',subj:'الكل',q:'',ytab:'hist'},H=[],T=0,RES=[];
const isSixth=v=>/سادس|السادس/.test(v.title+' '+(v.desc||''));
async function get(ep,p,map){
  if(!S.key)throw new Error('أضف مفتاح YouTube API من صفحة «أنت» ← الإعدادات.');
  const k=ep+JSON.stringify(p),c=S.cache[k];
  if(c&&Date.now()-c.t<21600000)return c.d;
  let j;
  try{j=await(await fetch('https://www.googleapis.com/youtube/v3/'+ep+'?'+new URLSearchParams({...p,key:S.key}))).json()}catch(e){throw new Error('تعذر الاتصال. افتح الملف من متصفح عادي وتأكد من الإنترنت.')}
  if(j.error)throw new Error('خطأ من يوتيوب: '+j.error.message);
  const d=map(j);S.cache[k]={t:Date.now(),d};save();return d;
}
const sn=i=>i.snippet;
const vids=(q,ch)=>get('search',{part:'snippet',type:'video',maxResults:30,q:q+SUFFIX,relevanceLanguage:'ar',safeSearch:'strict',...(ch?{channelId:ch}:{})},j=>(j.items||[]).map(i=>({id:i.id.videoId,title:dec(sn(i).title),ch:sn(i).channelTitle,chId:sn(i).channelId,desc:sn(i).description.slice(0,160),th:sn(i).thumbnails.high.url})).filter(isSixth));
const lists=q=>get('search',{part:'snippet',type:'playlist',maxResults:20,q:q+SUFFIX,relevanceLanguage:'ar'},j=>(j.items||[]).map(i=>({pl:i.id.playlistId,chId:sn(i).channelId,title:dec(sn(i).title),ch:sn(i).channelTitle,desc:sn(i).description.slice(0,160),th:sn(i).thumbnails.high.url})).filter(isSixth));
const plv=id=>get('playlistItems',{part:'snippet',maxResults:50,playlistId:id},j=>(j.items||[]).filter(i=>sn(i).resourceId&&sn(i).thumbnails&&sn(i).thumbnails.high).map(i=>({id:sn(i).resourceId.videoId,title:dec(sn(i).title),ch:sn(i).videoOwnerChannelTitle||'',chId:sn(i).videoOwnerChannelId||'',th:sn(i).thumbnails.high.url})));
const av=(n,id)=>{const u=S.avs[id];return `<span class="av" data-av="${esc(id||'')}" data-an="${esc(n)}" style="background:${u?`url(${esc(u)}) center/cover`:`hsl(${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 50% 42%)`}">${u?'':esc(String(n).trim()[0]||'؟')}</span>`};
const vcard=v=>`<div class="card" data-v="${esc(v.id)}"><img src="https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg" onerror="this.onerror=null;this.src='${esc(v.th)}'" alt="" loading="lazy"><div class="meta">${av(v.ch,v.chId)}<div><h3>${esc(v.title)}</h3><p>${esc(v.ch)}</p></div></div></div>`;
const pcard=(p,i)=>`<div class="card" data-p="${i}"><div class="rel"><img src="${esc(p.th)}" alt="" loading="lazy"><span class="tag">☰ قائمة تشغيل</span></div><div class="meta">${av(p.ch,p.chId)}<div><h3>${esc(p.title)}</h3><p>${esc(p.ch)} · دورة تدريبية</p></div></div></div>`;
const feed=l=>l.length?'<div class="feed">'+l.map(vcard).join('')+'</div>':'<div class="msg">لا توجد نتائج ضمن السادس الإعدادي. جرّب كلمات أخرى.</div>';
const chips=(arr,on,attr)=>`<div class="chips">${arr.map(s=>`<button class="chip ${s===on?'on':''}" ${attr}="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
const find=id=>RES.concat(S.hist,S.saved).find(v=>v.id===id);
const go=(n,x)=>{H.push(cur);cur=Object.assign({subj:'الكل',q:'',ytab:'hist'},{n},x);render();scrollTo(0,0)};
const back=()=>{cur=H.pop()||{n:'home',subj:'الكل',q:'',ytab:'hist'};render()};
function hdr(){
  const sub=['watch','pl','chan'].includes(cur.n),srch=cur.n==='search';
  $('hd').innerHTML=srch?`<button class="ib" id="bk" aria-label="رجوع">→</button><form class="sbox" id="sf"><input id="q" value="${esc(cur.q)}" placeholder="ابحث عن شرح درس" autofocus><button type="button" class="ib" id="cl" style="width:32px;height:32px" aria-label="مسح">✕</button></form>`
  :`${sub?'<button class="ib" id="bk" aria-label="رجوع">→</button>':''}<div class="logo"><i></i>REXTUP</div><button class="ib" id="so" aria-label="بحث">🔍</button>`;
  $('nv').innerHTML=NAV.map(([k,i,t])=>`<button data-nav="${k}" class="${cur.n===k||(k==='home'&&['search','watch'].includes(cur.n))?'on':''}"><span>${i}</span>${t}</button>`).join('');
}
async function render(){
  const tok=++T,m=$('mainv');hdr();
  const n=cur.n,msg=t=>m.innerHTML=`<div class="msg">${esc(t)}</div>`;
  try{
  if(n==='watch'){
    const v=cur.vid,sb=!!S.subs[v.chId],sv=S.saved.some(x=>x.id===v.id);
    m.innerHTML=`<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?rel=0&playsinline=1&modestbranding=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="${esc(v.title)}"></iframe></div><div class="w"><h1>${esc(v.title)}</h1><div class="bar">${av(v.ch,v.chId)}<b>${esc(v.ch)}</b>${v.chId?`<button class="pill ${sb?'':'w2'}" id="bs">${sb?'تم الاشتراك':'اشترك'}</button>`:''}<button class="pill" id="bv">${sv?'إزالة من المحفوظات':'🔖 حفظ'}</button><a class="pill" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(v.id)}">▶ فتح في يوتيوب</a></div><div class="msg" style="padding:14px;text-align:start">لتغيير الجودة اضغط ⚙️ داخل المشغّل. إن ظهر «خطأ 153» فاستخدم زر فتح في يوتيوب، أو شغّل التطبيق من رابط https.</div></div>`;
  }else if(n==='chan'){
    const sb=!!S.subs[cur.ch];
    m.innerHTML=`<div class="bar" style="padding-top:12px">${av(cur.chn,cur.ch)}<b style="font-size:1.1rem">${esc(cur.chn)}</b><button class="pill ${sb?'':'w2'}" id="bc">${sb?'تم الاشتراك':'اشترك'}</button></div><div id="out"><div class="msg">جاري التحميل…</div></div>`;
    const r=await vids('',cur.ch);if(tok!==T)return;RES=r;$('out').innerHTML=feed(r);
  }else if(n==='notes'){
    m.innerHTML=`<div class="wrap"><div class="board"><button class="clk" id="clk" aria-label="المؤقت">⏰</button><div class="papers">${S.notes.map(x=>`<div class="paper c${x.id%4}"><button class="x" data-dn="${x.id}" aria-label="حذف">✕</button><textarea data-nt="${x.id}" placeholder="اكتب ملاحظة مهمة…">${esc(x.t)}</textarea></div>`).join('')}<button class="paper add" id="addn" aria-label="ورقة جديدة">＋</button></div></div></div>`;
  }else if(n==='you'){
    const t=cur.ytab;
    m.innerHTML=chips(['السجل','المحفوظات','الإعدادات'],{hist:'السجل',saved:'المحفوظات',key:'الإعدادات'}[t],'data-yt')+(t==='key'?`<div class="w"><h2>مفتاح YouTube Data API</h2><div style="padding:6px 14px"><input class="field" id="ki" dir="ltr" style="width:100%" value="${esc(S.key)}"><br><br><button class="pill w2" id="ks">حفظ المفتاح</button></div></div>`:(()=>{const l=S[t];RES=l.concat(RES);return l.length?feed(l):'<div class="msg">لا يوجد شيء هنا بعد.</div>'})());
  }else if(n==='subs'){
    const ids=Object.keys(S.subs);
    if(!ids.length)return msg('لم تشترك في أي قناة. افتح فيديو واضغط اشترك.');
    const ch=cur.ch||ids[0];
    m.innerHTML=`<div class="chips">${ids.map(i=>`<button class="chip ${i===ch?'on':''}" data-ch="${esc(i)}">${esc(S.subs[i])}</button>`).join('')}</div><div id="out"><div class="msg">جاري التحميل…</div></div>`;
    const r=await vids('',ch);if(tok!==T)return;RES=r;$('out').innerHTML=feed(r);
  }else if(n==='arch'){
    m.innerHTML=chips(SUBJ,cur.subj,'data-as')+'<div id="out"><div class="msg">جاري تحميل الأرشيف…</div></div>';
    const r=await lists(cur.subj==='الكل'?'':cur.subj);if(tok!==T)return;RES.pls=r;
    $('out').innerHTML=r.length?'<div class="feed">'+r.map(pcard).join('')+'</div>':'<div class="msg">لا توجد دورات لهذه المادة حالياً.</div>';
    window.PLS=r;
  }else if(n==='pl'){
    m.innerHTML=`<h2>${esc(cur.pl.title)}</h2><div id="out"><div class="msg">جاري التحميل…</div></div>`;
    const r=await plv(cur.pl.pl);if(tok!==T)return;RES=r;$('out').innerHTML=feed(r);
  }else{
    const q=cur.q||(cur.subj==='الكل'?'':cur.subj);
    m.innerHTML=(n==='home'?chips(SUBJ,cur.q?'':cur.subj,'data-s'):'')+'<div id="out"><div class="msg">جاري البحث…</div></div>';
    const r=await vids(q);if(tok!==T)return;RES=r;$('out').innerHTML=feed(r);
  }
  loadAv();
  }catch(e){if(tok===T)msg(e.message)}
}
async function loadAv(){
  if(!S.key)return;
  const ids=[...new Set([...document.querySelectorAll('[data-av]')].map(e=>e.dataset.av).filter(i=>i&&!S.avs[i]))].slice(0,50);
  if(ids.length){try{const j=await(await fetch('https://www.googleapis.com/youtube/v3/channels?'+new URLSearchParams({part:'snippet',id:ids.join(','),key:S.key}))).json();(j.items||[]).forEach(i=>S.avs[i.id]=sn(i).thumbnails.default.url);save()}catch(e){}}
  document.querySelectorAll('[data-av]').forEach(e=>{const u=S.avs[e.dataset.av];if(u){e.style.background=`url(${u}) center/cover`;e.textContent=''}});
}
function sheet(){
  $('shc').innerHTML=`<h2 style="margin:0 0 8px">⏰ جدول الوقت والمنبه</h2>${S.sched.map(s=>`<div class="row"><input type="time" data-st="${s.id}" value="${esc(s.time)}"><input type="text" data-sk="${s.id}" value="${esc(s.task)}" placeholder="المطلوب في هذا الوقت"><label><input type="checkbox" data-so="${s.id}" ${s.on?'checked':''}>منبه</label><button data-ds="${s.id}" aria-label="حذف">✕</button></div>`).join('')||'<div class="msg" style="padding:16px">أضف وقتاً والمطلوب فيه.</div>'}<div class="row"><button class="pill w2" id="adds">＋ إضافة وقت</button><button class="pill" id="perm">تفعيل التنبيهات</button><button class="pill" id="shx" style="margin-inline-start:auto">إغلاق</button></div><div class="msg" style="padding:6px;font-size:.8rem">المنبه يتكرر يومياً، ويعمل والتطبيق مفتوح في المتصفح.</div>`;
  $('sh').classList.add('open');
}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
function ring(s){beep();navigator.vibrate&&navigator.vibrate([300,150,300]);$('rt').textContent='⏰ '+s.time+' — '+(s.task||'حان الوقت');$('ring').style.display='flex';
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification('REXTUP',{body:s.task||'حان الوقت'})}catch(e){}}}
setInterval(()=>{const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),day=d.toDateString();S.sched.forEach(s=>{if(s.on&&s.time===hm&&s.last!==day){s.last=day;save();ring(s)}})},15000);
document.addEventListener('click',e=>{
  const a=e.target.closest('.av');
  if(a&&a.dataset.av&&cur.n!=='chan'){go('chan',{ch:a.dataset.av,chn:a.dataset.an});return}
  const t=e.target.closest('button,.card,.chip');if(!t)return;const d=t.dataset;
  if(d.nav){H=[];cur={n:d.nav,subj:'الكل',q:'',ytab:'hist'};render();scrollTo(0,0)}
  else if(t.id==='so')go('search',{});
  else if(t.id==='bk')back();
  else if(t.id==='cl'){$('q').value='';$('q').focus()}
  else if(d.v){const v=find(d.v);if(!v)return;S.hist=[v,...S.hist.filter(x=>x.id!==v.id)].slice(0,100);save();go('watch',{vid:v})}
  else if(d.p!=null)go('pl',{pl:window.PLS[+d.p]});
  else if(d.s){cur.subj=d.s;cur.q='';render()}
  else if(d.as){cur.subj=d.as;render()}
  else if(d.ch){cur.ch=d.ch;render()}
  else if(d.yt){cur.ytab={'السجل':'hist','المحفوظات':'saved','الإعدادات':'key'}[d.yt];render()}
  else if(t.id==='bs'){const v=cur.vid;S.subs[v.chId]?delete S.subs[v.chId]:S.subs[v.chId]=v.ch;save();render()}
  else if(t.id==='bc'){S.subs[cur.ch]?delete S.subs[cur.ch]:S.subs[cur.ch]=cur.chn;save();render()}
  else if(t.id==='bv'){const v=cur.vid;S.saved=S.saved.some(x=>x.id===v.id)?S.saved.filter(x=>x.id!==v.id):[v,...S.saved];save();render()}
  else if(t.id==='ks'){S.key=$('ki').value.trim();save();cur.ytab='hist';render()}
  else if(t.id==='addn'){S.notes.push({id:Math.max(0,...S.notes.map(x=>x.id))+1,t:''});save();render();scrollTo(0,document.body.scrollHeight)}
  else if(d.dn){if(!confirm('حذف هذه الورقة؟'))return;S.notes=S.notes.filter(x=>x.id!==+d.dn);if(!S.notes.length)S.notes=[{id:1,t:''}];save();render()}
  else if(t.id==='clk')sheet();
  else if(t.id==='shx')$('sh').classList.remove('open');
  else if(t.id==='adds'){S.sched.push({id:Date.now(),time:'08:00',task:'',on:true});save();sheet()}
  else if(d.ds){S.sched=S.sched.filter(x=>x.id!==+d.ds);save();sheet()}
  else if(t.id==='perm'){if('Notification' in window)Notification.requestPermission().then(p=>alert(p==='granted'?'تم تفعيل التنبيهات':'لم يتم السماح. فعّلها من إعدادات المتصفح.'));else alert('متصفحك لا يدعم التنبيهات، وسيعمل الصوت والرسالة داخل الصفحة.')}
  else if(t.id==='rx')$('ring').style.display='none';
});
document.addEventListener('submit',e=>{if(e.target.id==='sf'){e.preventDefault();cur.q=$('q').value.trim();cur.n='home';H=[];render()}});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.nt){S.notes.find(x=>x.id===+d.nt).t=e.target.value;save()}
  else if(d.st){S.sched.find(x=>x.id===+d.st).time=e.target.value;save()}
  else if(d.sk){S.sched.find(x=>x.id===+d.sk).task=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.so){const s=S.sched.find(x=>x.id===+e.target.dataset.so);s.on=e.target.checked;s.last='';save()}});
render();
</script>
</body>
</html>
